<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Environmental Science Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Environmental Science</div>
      <h1>Learn: Laws, Resources &amp; Ethics</h1>
    </div>
    <div class="navrow" id="navrow" hidden>
      <nav class="tabs" aria-label="Pages">
        <a href="#learn" id="tabLearn">Learn</a>
        <a href="#terms" id="tabTerms">Term list</a>
      </nav>
      <button class="btn" id="settingsBtn" aria-expanded="false">Options</button>
      <a class="btn primary" id="dashBtn" href="dashboard.html" hidden>Teacher dashboard</a>
    </div>
  </header>

  <div class="userbar" id="userbar" hidden>
    <span id="who"></span>
    <button class="link" id="changePeriod">Change period</button>
    <button class="link" id="signOut">Sign out</button>
    <span class="sync" id="sync" role="status"></span>
  </div>

  <section class="progress" id="progress" aria-label="Progress" hidden>
    <div class="bar" aria-hidden="true"><span class="m" id="barM"></span><span class="l" id="barL"></span></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--accent)"></i>Mastered <b id="cM">0</b></span>
      <span><i class="dot" style="background:var(--learn)"></i>Learning <b id="cL">0</b></span>
      <span><i class="dot" style="background:var(--line)"></i>Not started <b id="cN">0</b></span>
    </div>
  </section>

  <section class="card settings" id="settings" hidden>
    <h2>Options</h2>
    <div class="field">
      <span class="label">Answer with</span>
      <div class="seg" id="dirSeg">
        <button data-v="term" aria-pressed="true">Term</button>
        <button data-v="def" aria-pressed="false">Definition</button>
        <button data-v="mix" aria-pressed="false">Both</button>
      </div>
    </div>
    <div class="field">
      <span class="label">Question types</span>
      <label class="check"><input type="checkbox" id="optWritten" checked> Include written questions (type the answer)</label>
      <label class="check"><input type="checkbox" id="optShuffle" checked> Shuffle term order</label>
    </div>
    <div class="field">
      <span class="label">Round size</span>
      <div class="seg" id="sizeSeg">
        <button data-v="5" aria-pressed="false">5</button>
        <button data-v="7" aria-pressed="true">7</button>
        <button data-v="10" aria-pressed="false">10</button>
      </div>
    </div>
    <div class="confirmRow" id="resetRow"></div>
    <div class="actions"><span></span><button class="btn primary" id="closeSettings">Done</button></div>
  </section>

  <section class="card" id="stage" aria-live="polite"><p class="lede">Loading…</p></section>

  <section class="terms" id="termsView" hidden>
    <div class="termsHead">
      <h2>Terms in this set</h2>
      <div class="seg" id="filterSeg">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="1" aria-pressed="false">Learning</button>
        <button data-v="2" aria-pressed="false">Mastered</button>
        <button data-v="0" aria-pressed="false">Not started</button>
      </div>
    </div>
    <ul class="tl" id="termList"></ul>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="terms.js"></script>
<script>
const TERMS = window.STUDY_SET.terms;
const $ = id => document.getElementById(id);
const stage = $("stage");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
$("eyebrow").textContent = `Environmental Science · ${TERMS.length} terms`;

/* ---------- local storage (settings + offline copy of progress) ---------- */
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const PREFS_KEY = "envsci-learn-settings";
const prefs = Object.assign({ dir: "term", written: true, shuffle: true, size: 7 }, readJSON(PREFS_KEY) || {});
const savePrefs = () => writeJSON(PREFS_KEY, prefs);
const fixLevels = arr => TERMS.map((_, i) => (Array.isArray(arr) && [0, 1, 2].includes(arr[i]) ? arr[i] : 0));
let level = TERMS.map(() => 0);
const localKey = () => "envsci-learn-progress-" + (user ? user.uid : "none");

/* ---------- answer choices from the same group ---------- */
function distractors(item) {
  let pool = shuffle(TERMS.filter(x => x.cat === item.cat && x.id !== item.id));
  for (const g of (window.STUDY_SET.related[item.cat] || [])) {
    if (pool.length >= 3) break;
    pool = pool.concat(shuffle(TERMS.filter(x => x.cat === g)));
  }
  if (pool.length < 3) pool = pool.concat(shuffle(TERMS.filter(x => x.id !== item.id && !pool.includes(x))));
  return pool.slice(0, 3);
}

/* ---------- answer checking ---------- */
const norm = s => s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function termVariants(t) {
  const v = new Set([t]);
  const paren = t.match(/^(.*?)\s*\((.*?)\)\s*$/);
  if (paren) { v.add(paren[1]); v.add(paren[2]); }
  const out = new Set();
  for (const x of v) {
    const n = norm(x); out.add(n); out.add(n.replace(/^the /, ""));
    if (n.endsWith("s")) out.add(n.slice(0, -1)); else out.add(n + "s");
  }
  return [...out];
}
function checkTerm(input, t) {
  const a = norm(input); if (!a) return false;
  const vs = termVariants(t);
  if (vs.includes(a) || vs.includes(a.replace(/^the /, ""))) return "exact";
  for (const v of vs) {
    const tol = v.length >= 12 ? 2 : v.length >= 5 ? 1 : 0;
    if (tol && lev(a, v) <= tol) return "close";
  }
  return false;
}

/* ---------- Firebase: sign-in and saving ---------- */
const configured = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/PASTE/.test(window.FIREBASE_CONFIG.apiKey));
let auth = null, db = null, user = null, ref = null, profile = null, isNew = false, inApp = false, authMsg = "";
if (configured) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
}
const PERIODS = window.CLASS_PERIODS || [];
const TEACHERS = (window.TEACHER_EMAILS || []).map(e => e.toLowerCase());
const isTeacher = () => !!(user && TEACHERS.includes((user.email || "").toLowerCase()));

function emailAllowed(email) {
  email = (email || "").toLowerCase();
  const ds = (window.ALLOWED_EMAIL_DOMAINS || []).map(d => d.toLowerCase());
  return !ds.length || ds.some(d => email.endsWith("@" + d) || email.endsWith("." + d));
}

let pending = newPending(), syncTimer = null;
function newPending() { return { answered: 0, correct: 0, rounds: 0, misses: {}, dirty: false }; }
function setSync(state) {
  const el = $("sync");
  el.className = "sync" + (state === "saved" ? " ok" : state === "error" ? " err" : "");
  el.textContent = state === "saved" ? "Progress saved" : state === "saving" ? "Saving…" : state === "error" ? "Not saved yet. Check your internet." : "";
}
function queueSync() {
  writeJSON(localKey(), level);
  pending.dirty = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flush, 1500);
}
async function flush() {
  clearTimeout(syncTimer);
  if (!ref || !profile || !pending.dirty) return;
  const p = pending; pending = newPending();
  const FV = firebase.firestore.FieldValue;
  const data = {
    name: profile.name, email: profile.email, period: profile.period || "",
    level: level.slice(),
    mastered: level.filter(x => x === 2).length,
    learning: level.filter(x => x === 1).length,
    total: TERMS.length,
    lastActive: FV.serverTimestamp()
  };
  if (isNew) data.firstSeen = FV.serverTimestamp();
  if (p.answered) data.answered = FV.increment(p.answered);
  if (p.correct) data.correct = FV.increment(p.correct);
  if (p.rounds) data.rounds = FV.increment(p.rounds);
  const mk = Object.keys(p.misses).filter(k => p.misses[k] > 0);
  if (mk.length) data.misses = Object.fromEntries(mk.map(k => [k, FV.increment(p.misses[k])]));
  setSync("saving");
  try {
    await ref.set(data, { merge: true });
    isNew = false;
    setSync(pending.dirty ? "saving" : "saved");
  } catch (e) {
    console.error(e);
    pending.answered += p.answered; pending.correct += p.correct; pending.rounds += p.rounds;
    for (const k in p.misses) pending.misses[k] = (pending.misses[k] || 0) + p.misses[k];
    pending.dirty = true;
    setSync("error");
    syncTimer = setTimeout(flush, 15000);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("pagehide", flush);

function showApp(on) {
  inApp = on;
  $("navrow").hidden = !on; $("userbar").hidden = !on; $("progress").hidden = !on;
  if (!on) { $("settings").hidden = true; $("termsView").hidden = true; stage.hidden = false; round = null; }
}
function gate(html) { showApp(false); stage.innerHTML = html; }

function renderSetupNeeded() {
  gate(`<div class="qhead"><span class="tag">Setup needed</span></div>
    <h2>This site isn't connected to Firebase yet</h2>
    <p class="lede">Teacher: paste your Firebase project settings into <b>firebase-config.js</b> and upload it to the same GitHub repository as this page.</p>`);
}
function renderSignIn(msg) {
  gate(`<div class="qhead"><span class="tag">Sign in</span></div>
    <h2>Sign in to start studying</h2>
    <p class="lede">Use your school Google account. Your progress saves to your account, so you can pick up where you left off on any device.</p>
    ${msg ? `<div class="feedback bad"><span class="h">${esc(msg)}</span></div>` : ""}
    <div class="actions"><a class="hint" href="dashboard.html">Teacher? Open the dashboard</a><button class="btn primary" id="signIn">Sign in with Google</button></div>`);
  $("signIn").addEventListener("click", signIn);
}
function friendlyAuthError(e) {
  const c = e && e.code;
  if (c === "auth/unauthorized-domain") return "This website isn't on Firebase's list of authorized domains yet. Tell your teacher.";
  if (c === "auth/network-request-failed") return "Couldn't reach Google. Check your internet connection and try again.";
  return "Sign-in didn't work (" + (c || (e && e.message) || "unknown error") + "). Try again, or tell your teacher.";
}
async function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try { await auth.signInWithPopup(provider); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(provider);
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    renderSignIn(friendlyAuthError(e));
  }
}
async function signOut() {
  await flush();
  if (user) { try { localStorage.removeItem(localKey()); } catch (e) {} }
  auth.signOut();
}
$("signOut").addEventListener("click", signOut);
$("changePeriod").addEventListener("click", renderPeriodPicker);

function renderPeriodPicker() {
  let chosen = profile.period && PERIODS.includes(profile.period) ? profile.period : "";
  gate(`<div class="qhead"><span class="tag">${profile.period ? "Change period" : "One more step"}</span></div>
    <h2>Which class period are you in?</h2>
    <p class="lede">Signed in as ${esc(profile.email)}. Your teacher uses this to sort the class list.</p>
    <div class="seg" id="periodSeg">${PERIODS.map(p => `<button data-v="${esc(p)}" aria-pressed="${p === chosen}">${esc(p)}</button>`).join("")}</div>
    <div class="actions"><button class="btn ghost" id="signOut2">Not you? Sign out</button><button class="btn primary" id="periodGo" ${chosen ? "" : "disabled"}>Start studying</button></div>`);
  $("periodSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    chosen = b.dataset.v; setSeg($("periodSeg"), chosen); $("periodGo").disabled = false;
  });
  $("periodGo").addEventListener("click", () => {
    profile.period = chosen; pending.dirty = true; flush(); enterApp();
  });
  $("signOut2").addEventListener("click", signOut);
}

function errorCard(title, e) {
  const denied = e && e.code === "permission-denied";
  gate(`<div class="qhead"><span class="tag">Problem</span></div>
    <h2>${esc(title)}</h2>
    <p class="lede">${denied ? "Firebase blocked this account. Make sure you signed in with your school account, or tell your teacher the security rules may need updating." : "Check your internet connection and try again."}</p>
    <p class="hint">Details: ${esc((e && (e.code || e.message)) || "unknown")}</p>
    <div class="actions"><button class="btn ghost" id="signOut3">Sign out</button><button class="btn primary" id="retry">Try again</button></div>`);
  $("retry").addEventListener("click", () => location.reload());
  $("signOut3").addEventListener("click", signOut);
}

function enterApp() {
  showApp(true);
  $("who").innerHTML = `<b>${esc(profile.name)}</b> · ${esc(profile.period)}`;
  $("dashBtn").hidden = !isTeacher();
  $("changePeriod").hidden = isTeacher();
  renderProgress(); renderList(); route(); startRound();
}

/* ---------- round engine ---------- */
let round = null;
let answered = false;
function pickDir() { return prefs.dir === "mix" ? (Math.random() < .5 ? "term" : "def") : prefs.dir; }
function qTypeFor(id) { return level[id] >= 1 && prefs.written ? "written" : "mc"; }

function startRound() {
  if (!inApp) return;
  const remaining = TERMS.filter(x => level[x.id] < 2).map(x => x.id);
  if (!remaining.length) return renderDone();
  let learning = remaining.filter(id => level[id] === 1);
  let fresh = remaining.filter(id => level[id] === 0);
  if (prefs.shuffle) { learning = shuffle(learning); fresh = shuffle(fresh); }
  const ids = learning.concat(fresh).slice(0, prefs.size);
  round = { queue: (prefs.shuffle ? shuffle(ids) : ids).map(id => ({ id, type: qTypeFor(id), dir: pickDir() })), idx: 0, results: new Map(), lastWrong: false };
  renderQuestion();
}

function record(id, correct, type) {
  if (correct) level[id] = (type === "mc" && prefs.written) ? Math.max(level[id], 1) : 2;
  else level[id] = level[id] === 2 ? 1 : Math.max(level[id], 1);
  pending.answered++;
  if (correct) pending.correct++; else pending.misses[id] = (pending.misses[id] || 0) + 1;
  round.results.set(id, round.results.has(id) ? round.results.get(id) && correct : correct);
  queueSync(); renderProgress(); renderList();
}

function next() {
  const q = round.queue[round.idx];
  if (round.lastWrong && !q.retried) round.queue.push({ ...q, retried: true, type: q.type === "written" && qTypeFor(q.id) === "written" ? "written" : "mc" });
  round.lastWrong = false;
  round.idx++;
  if (round.idx >= round.queue.length) renderCheckpoint(); else renderQuestion();
}

function headHTML(q) {
  return `<div class="qhead">
    <span class="tag ${q.type === "written" ? "written" : ""}">${q.type === "written" ? "Written" : "Multiple choice"}${q.retried ? " · try again" : ""}</span>
    <span class="roundinfo">Question ${round.idx + 1} / ${round.queue.length}</span></div>`;
}

function renderQuestion() {
  answered = false;
  const q = round.queue[round.idx];
  const item = TERMS[q.id];
  const promptIsTerm = q.dir === "def";
  const ask = q.type === "mc"
    ? (promptIsTerm ? "Choose the matching definition" : "Choose the matching term")
    : (promptIsTerm ? "Type the definition" : "Type the term");
  let body;
  if (q.type === "mc") {
    const opts = shuffle([item, ...distractors(item)]);
    body = `<div class="options">${opts.map((o, i) =>
      `<button class="opt" data-id="${o.id}"><span class="k">${i + 1}</span><span class="tx">${esc(promptIsTerm ? o.d : o.t)}</span></button>`).join("")}</div>
      <div class="actions"><span class="hint">Press <kbd>1</kbd>–<kbd>4</kbd> to answer</span><button class="btn ghost" id="dontKnow">Don't know?</button></div>`;
  } else {
    body = `<form class="writeRow" id="wform" autocomplete="off">
        <input id="answer" type="text" placeholder="${promptIsTerm ? "Type the definition" : "Type the term"}" aria-label="Your answer" spellcheck="false">
        <button class="btn primary" type="submit">Answer</button>
      </form>
      <div class="actions"><span class="hint">Press <kbd>Enter</kbd> to check</span><button class="btn ghost" id="dontKnow">Don't know?</button></div>`;
  }
  stage.innerHTML = `${headHTML(q)}
    <div class="prompt ${promptIsTerm ? "is-term" : ""}">${esc(promptIsTerm ? item.t : item.d)}</div>
    <div class="label">${ask}</div>
    ${body}<div id="fb"></div>`;
  stage.classList.remove("pop"); void stage.offsetWidth; stage.classList.add("pop");
  if (q.type === "mc") {
    stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMC(+b.dataset.id)));
  } else {
    const inp = $("answer");
    $("wform").addEventListener("submit", e => { e.preventDefault(); answerWritten(inp.value); });
    setTimeout(() => inp.focus({ preventScroll: true }), 30);
  }
  $("dontKnow").addEventListener("click", () => q.type === "mc" ? answerMC(-1) : answerWritten(null));
}

function continueButton() {
  return `<div class="actions" style="margin-top:12px"><span class="hint">Press <kbd>Enter</kbd> to continue</span><button class="btn primary" id="cont">Continue</button></div>`;
}

function answerMC(chosen) {
  if (answered) return; answered = true;
  const q = round.queue[round.idx];
  const ok = chosen === q.id;
  stage.querySelectorAll(".opt").forEach(b => {
    const id = +b.dataset.id; b.disabled = true;
    b.classList.add(id === q.id ? "right" : id === chosen ? "wrong" : "dim");
  });
  $("dontKnow").hidden = true;
  stage.querySelector(".hint").hidden = true;
  record(q.id, ok, "mc");
  if (ok) {
    $("fb").innerHTML = `<div class="feedback good"><span class="h">${pick(["Nice work!", "Correct!", "You got it.", "Exactly right."])}</span></div>`;
    setTimeout(() => { if (round && round.queue[round.idx] === q) next(); }, 900);
  } else {
    round.lastWrong = true;
    $("fb").innerHTML = `<div class="feedback bad"><span class="h">${chosen === -1 ? "Here's the answer. You'll see it again." : "Not quite. You'll see this one again."}</span></div>${continueButton()}`;
    $("cont").addEventListener("click", next); $("cont").focus({ preventScroll: true });
  }
}

function answerWritten(value) {
  if (answered) return;
  const q = round.queue[round.idx];
  const item = TERMS[q.id];
  const expectTerm = q.dir === "term";
  if (value !== null && !value.trim()) { $("answer").focus(); return; }
  answered = true;
  $("answer").disabled = true;
  stage.querySelector("#wform button").disabled = true;
  $("dontKnow").hidden = true;
  stage.querySelector(".hint").hidden = true;
  const correctText = expectTerm ? item.t : item.d;

  if (expectTerm && value !== null) {
    const res = checkTerm(value, item.t);
    if (res) {
      record(q.id, true, "written");
      $("fb").innerHTML = `<div class="feedback good"><span class="h">${res === "exact" ? "Correct!" : "Correct. Check your spelling."}</span>
        ${res === "close" ? `<dl class="cmp"><dt>Answer</dt><dd>${esc(correctText)}</dd></dl>` : ""}</div>`;
      setTimeout(() => { if (round && round.queue[round.idx] === q) next(); }, res === "exact" ? 900 : 1800);
      return;
    }
  }
  if (!expectTerm && value !== null) {
    $("fb").innerHTML = `<div class="feedback"><span class="label">Compare your answer</span>
      <dl class="cmp"><dt>You said</dt><dd>${esc(value)}</dd><dt>Answer</dt><dd><b>${esc(correctText)}</b></dd></dl></div>
      <div class="actions" style="margin-top:12px"><span class="hint">Did you get the main idea?</span>
      <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="selfNo">I missed it</button><button class="btn primary" id="selfYes">I got it</button></span></div>`;
    $("selfYes").addEventListener("click", () => { record(q.id, true, "written"); next(); });
    $("selfNo").addEventListener("click", () => { record(q.id, false, "written"); round.lastWrong = true; next(); });
    $("selfYes").focus({ preventScroll: true });
    return;
  }
  record(q.id, false, "written");
  round.lastWrong = true;
  $("fb").innerHTML = `<div class="feedback bad"><span class="h">${value === null ? "Here's the answer. You'll see it again." : "Not quite. You'll see this one again."}</span>
    <dl class="cmp">${value !== null ? `<dt>You said</dt><dd>${esc(value)}</dd>` : ""}<dt>Answer</dt><dd><b>${esc(correctText)}</b></dd></dl></div>
    <div class="actions" style="margin-top:12px">
      ${value !== null ? `<button class="btn ghost" id="override">I was right</button>` : "<span></span>"}
      <button class="btn primary" id="cont">Continue</button></div>`;
  $("cont").addEventListener("click", next); $("cont").focus({ preventScroll: true });
  const ov = $("override");
  if (ov) ov.addEventListener("click", () => {
    level[q.id] = 2; round.results.set(q.id, true); round.lastWrong = false;
    pending.correct++;
    if (pending.misses[q.id] > 0) pending.misses[q.id]--;
    queueSync(); renderProgress(); renderList(); next();
  });
}

function renderCheckpoint() {
  const ids = [...round.results.keys()];
  const right = ids.filter(id => round.results.get(id)).length;
  const mastered = level.filter(l => l === 2).length;
  const left = TERMS.length - mastered;
  pending.rounds++; queueSync();
  stage.innerHTML = `<div class="qhead"><span class="tag">Round complete</span><span class="roundinfo">${mastered} / ${TERMS.length} mastered</span></div>
    <div style="display:flex;gap:18px;align-items:end;flex-wrap:wrap">
      <div class="big">${right}/${ids.length}</div>
      <div style="padding-bottom:4px">correct on the first try this round.<br><span style="color:var(--muted)">${left ? `${left} term${left === 1 ? "" : "s"} left to master.` : "Every term is mastered."}</span></div>
    </div>
    <ul class="ck-list">${ids.map(id => {
      const ok = round.results.get(id), it = TERMS[id];
      return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><div><div class="t">${esc(it.t)}</div><div class="d">${esc(it.d)}</div></div></li>`;
    }).join("")}</ul>
    <div class="actions"><span class="hint">Press <kbd>Enter</kbd> to continue</span><button class="btn primary" id="cont">${left ? "Continue to next round" : "Finish"}</button></div>`;
  round = null;
  $("cont").addEventListener("click", startRound);
  $("cont").focus({ preventScroll: true });
}

function renderDone() {
  round = null;
  stage.innerHTML = `<div class="qhead"><span class="tag">Set complete</span></div>
    <div class="big">${TERMS.length}/${TERMS.length}</div>
    <p style="font-size:19px">You mastered every term in this set. Study it again to keep it fresh before the test.</p>
    <div class="actions"><span></span><button class="btn primary" id="again">Study again</button></div>`;
  $("again").addEventListener("click", () => { level = TERMS.map(() => 0); queueSync(); renderProgress(); renderList(); startRound(); });
}

function renderProgress() {
  const m = level.filter(l => l === 2).length, l = level.filter(x => x === 1).length;
  $("barM").style.width = (m / TERMS.length * 100) + "%";
  $("barL").style.width = (l / TERMS.length * 100) + "%";
  $("cM").textContent = m; $("cL").textContent = l; $("cN").textContent = TERMS.length - m - l;
}

let filter = "all";
function renderList() {
  const names = ["Not started", "Learning", "Mastered"];
  const items = TERMS.filter(x => filter === "all" || level[x.id] === +filter);
  $("termList").innerHTML = items.length
    ? items.map(x => `<li><span class="t">${esc(x.t)}</span><span class="d">${esc(x.d)}</span><span class="pill s${level[x.id]}">${names[level[x.id]]}</span></li>`).join("")
    : `<li><span class="d">No terms here yet.</span></li>`;
}

/* ---------- controls ---------- */
function setSeg(seg, v) { seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); }
function syncSettings() {
  setSeg($("dirSeg"), prefs.dir); setSeg($("sizeSeg"), prefs.size);
  $("optWritten").checked = prefs.written; $("optShuffle").checked = prefs.shuffle;
}
$("settingsBtn").addEventListener("click", () => {
  const open = $("settings").hidden; $("settings").hidden = !open; $("settingsBtn").setAttribute("aria-expanded", String(open));
});
$("closeSettings").addEventListener("click", () => { $("settings").hidden = true; $("settingsBtn").setAttribute("aria-expanded", "false"); startRound(); });
$("dirSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; prefs.dir = b.dataset.v; savePrefs(); syncSettings(); });
$("sizeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; prefs.size = +b.dataset.v; savePrefs(); syncSettings(); });
$("optWritten").addEventListener("change", e => { prefs.written = e.target.checked; savePrefs(); });
$("optShuffle").addEventListener("change", e => { prefs.shuffle = e.target.checked; savePrefs(); });
$("filterSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.v; setSeg($("filterSeg"), filter); renderList(); });

const resetRow = $("resetRow");
function bindReset() {
  resetRow.innerHTML = `<button class="btn danger" id="resetBtn">Reset progress</button>`;
  $("resetBtn").addEventListener("click", () => {
    resetRow.innerHTML = `<span>Clear progress on all ${TERMS.length} terms?</span><button class="btn danger" id="yesReset">Yes, reset</button><button class="btn ghost" id="noReset">Cancel</button>`;
    $("yesReset").addEventListener("click", () => { level = TERMS.map(() => 0); queueSync(); renderProgress(); renderList(); bindReset(); startRound(); });
    $("noReset").addEventListener("click", bindReset);
  });
}
bindReset();

document.addEventListener("keydown", e => {
  if (!inApp || (e.target.tagName === "INPUT" && e.target.type === "text")) return;
  if (!$("settings").hidden || !$("termsView").hidden) return;
  if (/^[1-4]$/.test(e.key)) {
    const b = stage.querySelectorAll(".opt")[+e.key - 1];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter") {
    const c = $("cont") || $("again");
    if (c && document.activeElement !== c) { e.preventDefault(); c.click(); }
  }
});

function route() {
  if (!inApp) return;
  const terms = location.hash === "#terms";
  $("termsView").hidden = !terms;
  stage.hidden = terms;
  $("settingsBtn").hidden = terms;
  if (terms) { $("settings").hidden = true; $("settingsBtn").setAttribute("aria-expanded", "false"); renderList(); }
  $("tabLearn").toggleAttribute("aria-current", !terms);
  $("tabTerms").toggleAttribute("aria-current", terms);
  (terms ? $("tabTerms") : $("tabLearn")).setAttribute("aria-current", "page");
}
window.addEventListener("hashchange", route);
syncSettings();

/* ---------- start ---------- */
if (!configured) renderSetupNeeded();
else {
  auth.getRedirectResult().catch(e => { authMsg = friendlyAuthError(e); });
  auth.onAuthStateChanged(async u => {
    user = u;
    if (!u) { ref = null; profile = null; const m = authMsg; authMsg = ""; return renderSignIn(m); }
    if (!emailAllowed(u.email)) {
      authMsg = `${u.email} isn't a school account. Sign in with your school Google account.`;
      return auth.signOut();
    }
    gate(`<p class="lede">Loading your progress…</p>`);
    ref = db.collection("students").doc(u.uid);
    let snap;
    try { snap = await ref.get(); }
    catch (e) { console.error(e); return errorCard("Couldn't load your progress", e); }
    const data = snap.exists ? snap.data() : {};
    isNew = !snap.exists;
    const cloud = fixLevels(data.level);
    const local = fixLevels(readJSON(localKey()));
    level = cloud.map((c, i) => Math.max(c, local[i]));
    profile = { name: u.displayName || u.email, email: u.email, period: isTeacher() ? "Teacher" : (data.period || "") };
    if (isTeacher() && data.period !== "Teacher") queueSync();
    if (isNew || local.some((l, i) => l > cloud[i])) queueSync();
    if (!isTeacher() && (!profile.period || !PERIODS.includes(profile.period))) return renderPeriodPicker();
    enterApp();
  });
}
</script>
</body>
</html>
